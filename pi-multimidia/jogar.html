<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Jogando · Projeto Integrador</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#000; overflow:hidden; font-family:"Montserrat",sans-serif; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; }
  .barra { position:fixed; top:12px; left:12px; z-index:5; display:flex; gap:8px; opacity:.35; transition:opacity .2s; }
  .barra:hover { opacity:1; }
  .barra a, .barra button { border:0; border-radius:99px; padding:9px 16px; font:700 13px "Montserrat",sans-serif;
    background:rgba(0,51,70,.9); color:#fff; text-decoration:none; cursor:pointer; }
  .barra a:hover, .barra button:hover { background:#00fff9; color:#003346; }
</style>
</head>
<body>
<div class="barra">
  <a href="./">← Jogos</a>
  <button id="tela">⛶ Tela cheia</button>
</div>
<iframe id="jogo" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
<script>
  const pasta = new URLSearchParams(location.search).get("j") || "";
  if (!/^[a-z0-9-]+$/i.test(pasta)) location.replace("./");
  const jogo = document.getElementById("jogo");
  jogo.src = "jogos/" + pasta + "/index.html";
  jogo.addEventListener("load", () => jogo.focus());
  document.getElementById("tela").onclick = () => document.documentElement.requestFullscreen?.();
</script>
</body>
</html>
